<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cucina">
<title>Cucina Associazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═══ RESET ═══ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ═══ TOKENS ═══ */
:root{
  /* surfaces */
  --sys:#F2F2F7;
  --card:#FFFFFF;
  --card2:#F2F2F7;
  --inset:#E5E5EA;
  /* text */
  --t1:#000000;
  --t2:rgba(60,60,67,.6);
  --t3:rgba(60,60,67,.3);
  /* separators */
  --sep:rgba(60,60,67,.13);
  --sep-strong:rgba(60,60,67,.22);
  /* brand */
  --blue:#007AFF;
  --blue-bg:rgba(0,122,255,.10);
  --green:#34C759;
  --green-bg:rgba(52,199,89,.10);
  --red:#FF3B30;
  --red-bg:rgba(255,59,48,.09);
  --orange:#FF9500;
  --orange-bg:rgba(255,149,0,.10);
  /* type */
  --mono:ui-monospace,'SF Mono','Menlo','Courier New',monospace;
  /* layout */
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  /* safe area */
  --safe-b:env(safe-area-inset-bottom,0px);
}

/* ═══ BASE ═══ */
html{background:var(--sys);color:var(--t1)}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  background:var(--sys);color:var(--t1);
  min-height:100dvh;
  padding-bottom:calc(56px + var(--safe-b));
  font-size:17px;line-height:1.4;
  -webkit-text-size-adjust:100%;
}

/* ═══ TAB BAR ═══ */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(56px + var(--safe-b));
  background:rgba(249,249,249,.94);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid var(--sep);
  display:flex;align-items:flex-start;padding-top:6px;
  z-index:100;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  border:none;background:none;cursor:pointer;
  color:var(--t3);font-family:inherit;padding:0 2px;
  min-height:44px;-webkit-tap-highlight-color:transparent;
}
.tab-btn.on{color:var(--blue)}
.tab-icon{width:26px;height:26px}
.tab-lbl{font-size:10px;font-weight:500;letter-spacing:-.1px;color:inherit}

/* ═══ SCREENS ═══ */
.screen{display:none}.screen.on{display:block}

/* ═══ PAGE HEADER ═══ */
.page-hd{
  background:var(--sys);
  padding:52px 16px 10px;
  position:sticky;top:0;z-index:50;
  border-bottom:.5px solid var(--sep);
}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.4px;color:var(--t1);line-height:1.15}
.page-sub{font-size:13px;color:var(--t2);margin-top:3px;letter-spacing:-.1px}
.page-hd-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}

/* content padding */
.content{padding:20px 0 12px}
.section{margin:0 0 8px;padding:0 16px}
.sec-hdr{
  font-size:12px;font-weight:600;color:var(--t2);
  text-transform:uppercase;letter-spacing:.06em;
  margin:20px 0 6px;padding-left:4px;
}

/* ═══ GROUPED LIST (iOS native feel) ═══ */
.list-group{
  background:var(--card);
  border-radius:var(--r-md);
  overflow:hidden;
}
.list-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;min-height:46px;
  border-bottom:.5px solid var(--sep);
  background:var(--card);
}
.list-row:last-child{border-bottom:none}
.list-row:active{background:var(--card2)}
.lr-label{flex:1;font-size:16px;color:var(--t1)}
.lr-sub{font-size:13px;color:var(--t2);margin-top:1px}
.lr-value{font-size:16px;color:var(--t2)}
.lr-mono{font-family:var(--mono);font-size:16px;font-weight:600}

/* ═══ COPERTI ═══ */
.cop-wrap{background:var(--card);border-radius:var(--r-md);overflow:hidden}
.cop-fields{display:grid;grid-template-columns:repeat(3,1fr)}
.cop-cell{
  padding:14px 8px 12px;text-align:center;
  border-right:.5px solid var(--sep);
  background:var(--card);
}
.cop-cell:last-child{border-right:none}
.cop-cell-lbl{
  font-size:11px;font-weight:600;color:var(--t2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;
}
.cop-cell input{
  display:block;width:100%;max-width:80px;margin:0 auto;
  font-size:30px;font-weight:700;font-family:var(--mono);
  text-align:center;color:var(--t1);
  background:var(--card2);border:none;border-radius:var(--r-sm);
  padding:8px 2px;outline:none;-webkit-appearance:none;appearance:none;
}
.cop-cell input:focus{background:var(--blue-bg)}
.cop-total{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-top:.5px solid var(--sep);
  background:var(--card);
}
.cop-total-lbl{font-size:15px;color:var(--t2);font-weight:500}
.cop-total-n{font-size:24px;font-weight:700;font-family:var(--mono);color:var(--blue)}
.cop-alt-row{
  padding:11px 16px;border-top:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--orange-bg);
}
.cop-alt-lbl{font-size:14px;color:var(--orange);font-weight:500}
.cop-alt-n{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--orange)}

/* ═══ ALT RAPIDO ═══ */
.alt-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-bottom:.5px solid var(--sep);
  background:var(--card);
}
.alt-item:last-child{border-bottom:none}
.alt-n-input{
  width:52px;height:42px;
  font-size:22px;font-weight:700;font-family:var(--mono);
  text-align:center;border:none;background:var(--orange-bg);
  border-radius:var(--r-sm);outline:none;color:var(--orange);
  -webkit-appearance:none;appearance:none;flex-shrink:0;
}
.alt-lbl-input{
  flex:1;font-size:16px;font-weight:500;
  border:none;background:none;color:var(--t1);
  outline:none;font-family:inherit;
}

/* ═══ PORTATE ═══ */
.portata-wrap{
  background:var(--card);border-radius:var(--r-md);overflow:hidden;
}
.portata-hd{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;cursor:pointer;min-height:52px;
  user-select:none;-webkit-tap-highlight-color:transparent;
  border-bottom:.5px solid transparent;
}
.portata-hd:active{background:var(--card2)}
.portata-name{flex:1;font-size:17px;font-weight:600;color:var(--t1)}
.portata-chips{display:flex;gap:5px;align-items:center}
.pchip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.01em}
.pchip-g{background:var(--green-bg);color:#248A3D}
.pchip-o{background:var(--orange-bg);color:#C93400}
.portata-body{
  display:none;
  border-top:.5px solid var(--sep);
}
.portata-body.op{display:block}
.sec-lbl{
  font-size:11px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.07em;
  padding:9px 16px 7px;
  background:var(--card2);
  border-bottom:.5px solid var(--sep);
}
.sec-lbl.alt-lbl{color:var(--orange);background:var(--orange-bg)}
.empty-row{
  padding:12px 16px;font-size:15px;color:var(--t3);
  border-bottom:.5px solid var(--sep);
}
.empty-row:last-child{border-bottom:none}

/* ricetta row */
.ric-item{padding:12px 16px;border-bottom:.5px solid var(--sep);background:var(--card)}
.ric-item:last-child{border-bottom:none}
.ric-item:active{background:var(--card2)}
.ric-header{display:flex;align-items:flex-start;gap:8px}
.ric-name{font-size:16px;font-weight:600;color:var(--t1);flex:1}
.ric-meta{font-size:13px;color:var(--t2);margin-top:2px}
.ric-actions{display:flex;gap:4px;flex-shrink:0;align-items:flex-start}

/* ing mini */
.ing-mini{
  margin:8px 0 0;border-radius:var(--r-sm);
  overflow:hidden;border:.5px solid var(--sep);
}
.ing-mini-row{
  display:flex;align-items:center;
  border-bottom:.5px solid var(--sep);font-size:13px;
}
.ing-mini-row:last-child{border-bottom:none}
.ing-mini-name{flex:1;padding:7px 10px;color:var(--t1)}
.ing-mini-val{padding:7px 10px;font-family:var(--mono);font-weight:700;color:var(--blue);text-align:right;white-space:nowrap}
.ing-mini-forn{padding:7px 10px;font-size:11px;font-weight:700;white-space:nowrap}

/* pane toggle */
.portata-footer{
  padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;
  background:var(--card2);border-top:.5px solid var(--sep);
}
.pane-toggle-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-top:.5px solid var(--sep);background:var(--card);
}

/* ═══ TOGGLE ═══ */
.toggle{
  width:51px;height:31px;border-radius:100px;
  border:none;cursor:pointer;position:relative;
  flex-shrink:0;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.toggle.on{background:var(--green)}
.toggle.off{background:#E5E5EA}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:27px;height:27px;border-radius:50%;
  background:#fff;transition:transform .2s;
  box-shadow:0 2px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.04);
}
.toggle.on::after{transform:translateX(20px)}

/* ═══ ING BUILDER (modal) ═══ */
.ing-builder{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ing-card{
  background:var(--card2);border-radius:var(--r-md);
  padding:14px;position:relative;
  border:.5px solid var(--sep);
}
.ing-card-idx{
  font-size:11px;font-weight:700;color:var(--t2);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;
}
.ing-del{
  position:absolute;top:10px;right:12px;
  background:none;border:none;color:var(--red);
  font-size:22px;cursor:pointer;padding:4px;line-height:1;
  -webkit-tap-highlight-color:transparent;
}
.ing-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

/* ═══ BUTTONS ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 18px;border-radius:var(--r-md);
  font-size:16px;font-weight:600;font-family:inherit;
  border:none;cursor:pointer;
  transition:opacity .15s;-webkit-tap-highlight-color:transparent;line-height:1;
}
.btn:active{opacity:.72}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--card2);color:var(--blue)}
.btn-danger{background:var(--red-bg);color:var(--red)}
.btn-am{background:var(--orange-bg);color:var(--orange)}
.btn-sm{padding:7px 14px;font-size:14px;border-radius:var(--r-sm)}
.btn-full{width:100%;display:flex}
.btn-text{
  background:none;border:none;color:var(--blue);
  font-size:15px;font-weight:500;cursor:pointer;
  font-family:inherit;padding:4px 0;
  -webkit-tap-highlight-color:transparent;
}
.btn-text-red{color:var(--red)}
.btn-text-sm{font-size:14px}

/* ═══ FORMS ═══ */
.form-field{margin-bottom:14px}
.form-label{
  display:block;font-size:12px;font-weight:600;color:var(--t2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;
}
.form-input{
  display:block;width:100%;padding:12px 14px;
  font-size:16px;font-family:inherit;color:var(--t1);
  background:var(--card2);border:none;border-radius:var(--r-md);
  outline:none;-webkit-appearance:none;appearance:none;line-height:1.3;
}
.form-input:focus{background:rgba(0,122,255,.07)}
select.form-input{cursor:pointer}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-check{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;background:var(--card2);
  border-radius:var(--r-md);cursor:pointer;
  margin-bottom:14px;
}
.form-check input{width:22px;height:22px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.form-check-label{font-size:16px;font-weight:500}

/* ═══ SPESA ═══ */
.chips{
  display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 14px;border-radius:100px;
  border:.5px solid var(--sep-strong);
  font-size:14px;font-weight:500;cursor:pointer;
  background:var(--card);color:var(--t2);
  font-family:inherit;white-space:nowrap;
}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

.forn-block{
  background:var(--card);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:10px;
}
.forn-block-hd{
  padding:10px 16px;
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  border-bottom:.5px solid var(--sep);
  background:var(--card2);
}
.spesa-row{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;border-bottom:.5px solid var(--sep);
  background:var(--card);
}
.spesa-row:last-child{border-bottom:none}
.spesa-row:active{background:var(--card2)}
/* custom checkbox */
.s-check{
  width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--t3);background:var(--card);
  flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.s-check.on{background:var(--blue);border-color:var(--blue)}
.s-check.on::after{
  content:'';width:10px;height:8px;
  border-bottom:2px solid #fff;border-left:2px solid #fff;
  transform:rotate(-45deg) translate(1px,0);display:block;
}
.s-name{flex:1;font-size:16px;font-weight:500;color:var(--t1)}
.s-name.done{color:var(--t3);text-decoration:line-through}
.s-qty-col{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.s-qty{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--blue)}
.s-qty.base{color:var(--t2);font-weight:500}
.s-extra{display:flex;align-items:center;gap:4px}
.s-extra input,.s-extra select{
  font-size:13px;padding:5px 6px;
  border:.5px solid var(--sep-strong);border-radius:6px;
  background:var(--card2);color:var(--t1);
  outline:none;-webkit-appearance:none;appearance:none;font-family:inherit;
}
.s-extra input{width:58px;text-align:right;font-family:var(--mono)}
.s-extra select{width:56px}
.s-price input{
  width:80px;padding:7px 9px;font-size:14px;
  border:.5px solid var(--sep-strong);border-radius:8px;
  background:var(--card2);color:var(--t1);
  text-align:right;outline:none;-webkit-appearance:none;appearance:none;
  font-family:var(--mono);
}

.pane-banner{
  background:var(--orange-bg);border-left:3px solid var(--orange);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:11px 16px;font-size:15px;font-weight:500;color:var(--orange);
  margin-bottom:12px;
}
.total-card{
  background:var(--card);border-radius:var(--r-md);
  padding:15px 18px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:.5px solid var(--sep);margin-top:2px;
}
.total-label{font-size:14px;color:var(--t2);font-weight:500}
.total-sub{font-size:12px;color:var(--t3);margin-top:2px}
.total-n{font-size:26px;font-weight:700;font-family:var(--mono);color:var(--t1)}

/* ═══ COSTI ═══ */
.forn-cost-block{
  background:var(--card);border-radius:var(--r-md);
  overflow:hidden;margin-bottom:10px;
}
.forn-cost-hd{
  padding:11px 16px;border-bottom:.5px solid var(--sep);
  background:var(--card2);
  display:flex;align-items:center;justify-content:space-between;
}
.forn-cost-name{font-size:14px;font-weight:700}
.mode-switch{
  display:flex;gap:0;border:.5px solid var(--sep-strong);
  border-radius:var(--r-sm);overflow:hidden;
}
.mode-btn{
  padding:5px 12px;font-size:12px;font-weight:600;
  border:none;cursor:pointer;font-family:inherit;
  transition:all .12s;
}
.mode-btn.on{background:var(--blue);color:#fff}
.mode-btn.off{background:var(--card);color:var(--t2)}

/* ═══ BADGES ═══ */
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.01em}
.badge-blue{background:var(--blue-bg);color:#0050CC}
.badge-gray{background:var(--card2);color:var(--t2)}
.badge-green{background:var(--green-bg);color:#1A7A30}
.badge-orange{background:var(--orange-bg);color:#C93400}
.info-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px;letter-spacing:.01em}
.ib-blue{background:var(--blue-bg);color:#0050CC}
.ib-green{background:var(--green-bg);color:#1A7A30}
.ib-gray{background:var(--card2);color:var(--t2)}
.ib-orange{background:var(--orange-bg);color:#C93400}

/* ═══ STORICO ═══ */
.ev-item{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:.5px solid var(--sep);
  cursor:pointer;background:var(--card);
}
.ev-item:last-child{border-bottom:none}
.ev-item:active{background:var(--card2)}
.ev-date{font-family:var(--mono);font-size:12px;color:var(--t2);white-space:nowrap}
.ev-name{flex:1;font-size:16px;font-weight:600;color:var(--t1)}
.ev-badges{display:flex;gap:5px;flex-shrink:0}

/* ═══ FORNITORI ═══ */
.f-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ═══ MODAL ═══ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.36);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  display:none;align-items:flex-end;
}
.modal-overlay.on{display:flex}
.modal-sheet{
  background:var(--sys);
  border-radius:20px 20px 0 0;width:100%;
  max-height:94dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(28px + var(--safe-b));
  animation:sup .28s cubic-bezier(.25,.46,.45,.94);
}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
.modal-handle{width:36px;height:4px;background:var(--sep-strong);border-radius:2px;margin:12px auto 0}
.modal-hd{
  position:sticky;top:0;background:var(--sys);z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;border-bottom:.5px solid var(--sep);
}
.modal-title{font-size:17px;font-weight:700;color:var(--t1)}
.modal-close{
  background:none;border:none;color:var(--blue);
  font-size:17px;font-weight:500;cursor:pointer;
  font-family:inherit;padding:4px;min-width:44px;text-align:right;
}
.modal-body{padding:18px 20px}
.modal-footer{padding:12px 20px;border-top:.5px solid var(--sep);display:flex;gap:10px}
.modal-footer .btn{flex:1}
.divider{height:.5px;background:var(--sep);margin:16px 0}

/* ═══ MISC ═══ */
.empty{text-align:center;padding:44px 20px;color:var(--t3);font-size:15px;line-height:1.6}
.chevron-icon{
  width:13px;height:13px;flex-shrink:0;color:var(--t3);
  transition:transform .22s cubic-bezier(.25,.46,.45,.94);
}
.chevron-icon.open{transform:rotate(180deg)}
</style>
</head>
<body>

<!-- TAB BAR -->
<nav class="tabbar">
  <button class="tab-btn on" data-s="menu" onclick="goTo(this)">
    <svg class="tab-icon" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="15" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="15" width="8" height="8" rx="1.5"/><rect x="15" y="15" width="8" height="8" rx="1.5"/></svg>
    <span class="tab-lbl">Menu</span>
  </button>

  <button class="tab-btn" data-s="spesa" onclick="goTo(this)">

<script>
// ════════════════════════
// CONFIG
// ════════════════════════
const PORTATE=[
  {id:'antipasto',label:'Antipasti'},
  {id:'primo',label:'Primi piatti'},
  {id:'secondo',label:'Secondi piatti'},
  {id:'contorno',label:'Contorni'},
  {id:'dolce',label:'Dolce e frutta'}
];
const ALLERGIE=[
  {id:'celiachia',label:'Celiachia / Glutine',cls:'a-cel'},
  {id:'lattosio',label:'Lattosio',cls:'a-lat'},
  {id:'fruttasecca',label:'Frutta secca',cls:'a-fru'},
  {id:'vegano',label:'Vegano',cls:'a-veg'},
  {id:'vegetariano',label:'Vegetariano',cls:'a-vgt'},
  {id:'uova',label:'Uova',cls:'a-uov'},
  {id:'pesce',label:'Pesce',cls:'a-pes'},
  {id:'crostacei',label:'Crostacei',cls:'a-cro'},
  {id:'soia',label:'Soia',cls:'a-soi'},
  {id:'altro',label:'Altro',cls:'a-alt'}
];
const UNITS=['g','kg','ml','l','pz','fette','cucchiai','spicchi'];

// ════════════════════════
// STATE
// ════════════════════════
let det={adulti:50,bambini:0,cucina:0};
let eventoTitolo='';
let altRapido=[];
let ricette=[],fornitori=[],ospiti=[],storico=[];
let pane={on:false,note:''};
let spesaItems=[],spesaExtra=[];
let filtroF='tutti',ctabMode='s';
let openP={};

function initF(){
  fornitori=[
    {id:'f1',nome:'Supermercato',color:'#34C759'},
    {id:'f2',nome:'Fornitore carne',color:'#FF3B30'},
    {id:'f3',nome:'Beverage',color:'#007AFF'},
    {id:'f4',nome:'Fresco / Ortofrutta',color:'#FF9500'}
  ];
}

// ════════════════════════
// PERSIST
// ════════════════════════
function save(){
  try{localStorage.setItem('cucina_v2',JSON.stringify({det,altRapido,eventoTitolo,ricette,fornitori,spesaItems,spesaExtra,ospiti,storico,pane,fornCosti}));}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('cucina_v2')||'{}');
    if(d.det)det=Object.assign({adulti:50,bambini:0,cucina:0},d.det);
    if(d.altRapido)altRapido=d.altRapido;
    if(d.eventoTitolo)eventoTitolo=d.eventoTitolo;
    if(d.ricette)ricette=d.ricette;
    if(d.fornitori&&d.fornitori.length)fornitori=d.fornitori;else initF();
    if(d.spesaItems)spesaItems=d.spesaItems;
    if(d.spesaExtra)spesaExtra=d.spesaExtra;
    if(d.ospiti)ospiti=d.ospiti;
    if(d.storico)storico=d.storico;
    if(d.pane)pane=d.pane;
    if(d.fornCosti)fornCosti=d.fornCosti;
  }catch(e){initF();}
}

// ════════════════════════
// UTILS
// ════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function eur(n){return '€ '+n.toFixed(2).replace('.',',');}
function fQ(n,u){
  if(n===null||n===undefined||isNaN(n))return '—';
  if(u==='g'&&n>=1000)return (n/1000).toFixed(2)+' kg';
  if(u==='ml'&&n>=1000)return (n/1000).toFixed(2)+' l';
  return (n>=100?Math.round(n):n>=10?parseFloat(n.toFixed(1)):parseFloat(n.toFixed(2)))+' '+(u||'');
}
function totCop(){
  const base=(det.adulti||0)+(det.bambini||0)+(det.cucina||0);
  const alt=altRapido.reduce((a,x)=>a+(x.n||0),0);
  return base+alt;
}
function totAlt(){return altRapido.reduce((a,x)=>a+(x.n||0),0);}
function calcQ(ing){return ing.modo==='tot'?ing.qta:ing.qta*totCop();}
function calcFin(s){
  const base=s.modo==='tot'?s.qta:s.qta*totCop();
  let ex=s.extraQta||0;const eu=s.extraUnit||s.unit;
  if(s.unit==='g'&&eu==='kg')ex*=1000;else if(s.unit==='kg'&&eu==='g')ex/=1000;
  else if(s.unit==='ml'&&eu==='l')ex*=1000;else if(s.unit==='l'&&eu==='ml')ex/=1000;
  return base+ex;
}
function aInfo(id){return ALLERGIE.find(a=>a.id===id)||{label:id,cls:'a-alt'};}
function fInfo(id){return fornitori.find(f=>f.id===id)||{nome:'—',color:'#8E8E93'};}
function uOpts(s){return UNITS.map(u=>`<option value="${u}"${u===s?' selected':''}>${u}</option>`).join('');}
function fOpts(s){return fornitori.map(f=>`<option value="${f.id}"${f.id===s?' selected':''}>${f.nome}</option>`).join('');}

// ════════════════════════
// NAVIGATION
// ════════════════════════
function goTo(el){
  const s=el.dataset.s;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById('s-'+s).classList.add('on');
  window.scrollTo({top:0,behavior:'instant'});
  if(s==='spesa'){ricalcola();renderSpesa();}
  if(s==='ospiti')renderOspiti();
  if(s==='forn')renderFornitori();
  if(s==='costi')renderCosti();
  if(s==='storico')renderStorico();
}

// ════════════════════════
// COPERTI
// ════════════════════════
function setCop(k,v){
  det[k]=Math.max(0,parseInt(v)||0);
  updCopDisplay();
  save();
}
function updCopDisplay(){
  const n=totCop();
  const altN=altRapido.reduce((a,x)=>a+(x.n||0),0);
  const base=n-altN;
  // aggiorna totale
  const el=document.getElementById('cop-tot');
  if(el)el.textContent=n;
  // riga alternativi
  const altRow=document.getElementById('cop-alt-row');
  const altNEl=document.getElementById('cop-alt-n');
  if(altRow)altRow.style.display=altN>0?'block':'none';
  if(altNEl)altNEl.textContent=altN;
  // sottotitolo
  const ms=document.getElementById('menu-sub');
  const tt=document.getElementById('ev-title-display');
  const titolo=typeof eventoTitolo!=='undefined'?eventoTitolo:'';
  if(ms)ms.textContent=(titolo?titolo+' — ':'')+`${n} coperti${altN?' (di cui '+altN+' alternativi)':''}`;
}

// ════════════════════════
// ALT RAPIDO
// ════════════════════════
function renderAlt(){
  const el=document.getElementById('alt-list');if(!el)return;
  if(!altRapido.length){
    el.innerHTML='<div class="list-row" style="color:var(--t3)">Nessun menu alternativo aggiunto</div>';
  } else {
    el.innerHTML=altRapido.map((a,i)=>`
      <div class="alt-item">
        <input class="alt-n-input" type="number" inputmode="numeric" value="${a.n}" min="0" oninput="altRapido[${i}].n=parseInt(this.value)||0;save()">
        <input class="alt-lbl-input" type="text" value="${a.label}" placeholder="es. Celiaci" oninput="altRapido[${i}].label=this.value;save()">
        <button class="btn-text btn-text-red" onclick="altRapido.splice(${i},1);renderAlt();save()">Rimuovi</button>
      </div>`).join('');
  }
  // ospiti collegati
  const cnt={};ospiti.forEach(o=>o.allergie.forEach(a=>{cnt[a]=(cnt[a]||0)+1;}));
  const li=document.getElementById('alt-linked');
  if(li){
    const e=Object.entries(cnt);
    li.innerHTML=e.length?'Da ospiti: '+e.map(([id,n])=>{const i=aInfo(id);return `<span class="atag ${i.cls}" style="margin-right:3px">${i.label} ${n}</span>`;}).join(''):'';
  }
  updCopDisplay();
}
function addAlt(){altRapido.push({label:'Tipo',n:0});renderAlt();updCopDisplay();save();}

function resetTutto(){
  if(!confirm('Azzerare tutto? Ricette, ingredienti, coperti, costi e lista spesa verranno eliminati. Gli eventi salvati nello storico vengono mantenuti.')) return;
  det={adulti:0,bambini:0,cucina:0};
  altRapido=[];
  ricette=[];
  pane={on:false,note:''};
  spesaItems=[];
  spesaExtra=[];
  ospiti=[];
  eventoTitolo='';
  openP={};
  // reset inputs
  ['adulti','bambini','cucina'].forEach(k=>{const el=document.getElementById('c-'+k);if(el)el.value=0;});
  const eti=document.getElementById('ev-title-input');if(eti)eti.value='';
  updCopDisplay();
  renderPortate();
  renderAlt();
  save();
}

// ════════════════════════
// PORTATE
// ════════════════════════
function renderPortate(){
  const c=totCop();
  const ms=document.getElementById('menu-sub');
  if(ms)ms.textContent=`${c} coperti${ricette.length?' — '+ricette.filter(r=>!r.isAlt).length+' ricette':''}`;
  const el=document.getElementById('portate-list');
  el.innerHTML=PORTATE.map(p=>{
    const std=ricette.filter(r=>r.portata===p.id&&!r.isAlt);
    const alt=ricette.filter(r=>r.portata===p.id&&r.isAlt);
    const isO=openP[p.id];
    return `<div class="portata-wrap">
      <div class="portata-hd" onclick="togP('${p.id}')">
        <span class="portata-name">${p.label}</span>
        <div class="portata-chips">
          ${std.length?`<span class="pchip pchip-g">${std.length}</span>`:''}
          ${altRapido.filter(at=>alt.some(r=>r.altLabel===at.label)).map(at=>`<span class="pchip pchip-o">${at.label}</span>`).join('')}
          ${!std.length&&!alt.length&&!altRapido.length?`<span class="info-badge ib-gray">vuoto</span>`:''}
        </div>
        <svg class="chevron-icon ${isO?'open':''}" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="2 4 6.5 8.5 11 4"/></svg>
      </div>
      <div class="portata-body ${isO?'op':''}">
        <div class="sec-label">Menu standard — tutti</div>
        ${std.length===0?`<div class="empty-row">Nessuna ricetta standard</div>`:std.map(r=>ricHTML(r,c)).join('')}
        <div class="portata-footer">
          <button class="btn btn-sm btn-primary" onclick="openAddRic('${p.id}',false)">+ Aggiungi</button>
        </div>
        ${altRapido.length?altRapido.map(at=>{
          const altRic=alt.filter(r=>r.altLabel===at.label);
          return `<div style="border-top:.5px solid var(--sep)">
            <div class="sec-label alt" style="display:flex;align-items:center;justify-content:space-between">
              <span>${at.label} <span style="background:rgba(255,149,0,.15);color:var(--orange);font-size:11px;padding:1px 7px;border-radius:100px;font-weight:700;margin-left:4px">${at.n}</span></span>
            </div>
            ${altRic.length===0?`<div class="empty-row">Nessuna ricetta per ${at.label}</div>`:altRic.map(r=>ricHTML(r,c,true)).join('')}
            <div class="portata-footer">
              <button class="btn btn-sm btn-am" onclick="openAddRic('${p.id}',true,'',at.label)">+ Ricetta per ${at.label}</button>
            </div>
          </div>`;
        }).join(''):''}
      </div>
    </div>`;
  }).join('')+paneHTML();
}

function ricHTML(r,c,isAlt){
  const spTag=r.isAlt
    ?(r.genSpesa?`<span class="info-badge ib-green">spesa</span>`:`<span class="info-badge ib-gray">promemoria</span>`)
    :'';
  return `<div class="ric-item" style="${isAlt?'background:rgba(255,149,0,.02)':''}">
    <div class="ric-header">
      <div class="ric-info">
        <div class="ric-name">${r.nome} ${spTag}</div>
        <div class="ric-meta">${r.note?r.note+' — ':''} ${r.ingredienti?.length||0} ingredienti · ${c} cop.</div>
      </div>
      <div class="ric-actions">
        <button class="btn-text" style="font-size:14px" onclick="openAddRic(null,${!!isAlt},'${r.id}')">Modifica</button>
        <button class="btn-text btn-text-red" style="font-size:14px" onclick="delRic('${r.id}')">Elimina</button>
      </div>
    </div>
    ${r.ingredienti?.length?`
      <div class="ing-mini">
        ${r.ingredienti.map(i=>{const fi=fInfo(i.fornitoreId);return `<div class="ing-mini-row">
          <span class="ing-mini-name">${i.nome}</span>
          <span class="ing-mini-val">${fQ(calcQ(i),i.unit)}</span>
          <span class="ing-mini-forn" style="color:${fi.color}">${fi.nome}</span>
        </div>`;}).join('')}
      </div>`:''
    }
  </div>`;
}

function paneHTML(){
  const isO=openP['pane'];
  return `<div class="portata-wrap" style="margin-top:0">
    <div class="portata-hd" onclick="togP('pane')">
      <span class="portata-name">Pane</span>
      <span class="info-badge ${pane.on?'ib-green':'ib-gray'}">${pane.on?'Da comprare':'Non necessario'}</span>
      <svg class="chevron-icon ${isO?'open':''}" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="2 4 6.5 8.5 11 4"/></svg>
    </div>
    <div class="portata-body ${isO?'op':''}">
      <div class="pane-toggle-row">
        <span style="font-size:16px;font-weight:500">${pane.on?'Da comprare (q.b.)':'Non necessario'}</span>
        <button class="toggle ${pane.on?'on':'off'}" onclick="pane.on=!pane.on;save();renderPortate()"></button>
      </div>
      ${pane.on?`<div style="padding:0 16px 14px"><input class="form-input" style="font-size:15px;padding:11px 13px" placeholder="Tipo di pane, note…" value="${pane.note||''}" oninput="pane.note=this.value;save()"></div>`:''}
    </div>
  </div>`;
}

function togP(id){openP[id]=!openP[id];renderPortate();}
function delRic(id){if(!confirm('Eliminare?'))return;ricette=ricette.filter(r=>r.id!==id);renderPortate();save();}

function openAddRic(presetP,presetAlt,editId,presetAltLabel){
  const r=editId?ricette.find(x=>x.id===editId):null;
  const isAlt=r?r.isAlt:!!presetAlt;
  const genSpesa=r?(r.genSpesa!==undefined?r.genSpesa:true):true;
  const _altLabel=r?r.altLabel:(presetAltLabel||'');
  const pOpts=PORTATE.map(p=>`<option value="${p.id}"${(presetP||r?.portata)===p.id?' selected':''}>${p.label}</option>`).join('');
  const ingCards=r?.ingredienti?.length?r.ingredienti.map((i,idx)=>ingCardHTML(idx,i)).join(''):ingCardHTML(0);
  window._ic=r?.ingredienti?.length||1;

  setModal(r?'Modifica ricetta':'Nuova ricetta',`
    <div class="form-row2">
      <div class="form-field"><label class="form-label">Nome</label><input class="form-input" id="r-nome" value="${r?r.nome:''}" placeholder="es. Risotto ai funghi" autocomplete="off"></div>
      <div class="form-field"><label class="form-label">Portata</label><select class="form-input" id="r-portata">${pOpts}</select></div>
    </div>
    <div class="form-field"><label class="form-label">Note (opzionale)</label><input class="form-input" id="r-note" value="${r?r.note||'':''}" placeholder="es. senza glutine…"></div>
    <label class="form-check" style="background:${isAlt?'rgba(255,149,0,.08)':'rgba(0,122,255,.06)'}">
      <input type="checkbox" id="r-isalt" ${isAlt?'checked':''} onchange="toggleAltUI()">
      <span class="form-check-label" style="color:${isAlt?'var(--orange)':'var(--blue)'}">Menu alternativo</span>
    </label>
    <div id="gen-wrap" style="display:${isAlt?'block':'none'};margin-bottom:14px">
      ${altRapido.length?`<div class="form-field"><label class="form-label">Per quale tipo</label><select class="form-input" id="r-altlabel"><option value="">— tutti gli alternativi —</option>${altRapido.map(a=>`<option value="${a.label}"${_altLabel===a.label?' selected':''}>${a.label} (${a.n})</option>`).join('')}</select></div>`:''}
      <label class="form-check">
        <input type="checkbox" id="r-genspesa" ${genSpesa?'checked':''}>
        <span class="form-check-label">Genera lista spesa</span>
      </label>
    </div>
    <div class="divider"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="font-size:14px;font-weight:600;color:var(--t2)">INGREDIENTI</div>
      <div style="font-size:12px;color:var(--t3)">Per persona moltiplicato × coperti. Fisso = invariabile.</div>
    </div>
    <div class="ing-builder" id="ing-builder">${ingCards}</div>
    <button class="btn btn-secondary btn-full" style="margin-top:8px" type="button" onclick="addIngCard()">+ Aggiungi ingrediente</button>
  `,`
    <button class="btn btn-secondary" onclick="closeM()">Annulla</button>
    <button class="btn btn-primary" onclick="salvaRic('${editId||''}')">Salva ricetta</button>
  `);
}

function ingCardHTML(idx,ing){
  const m=ing?.modo||'pp';
  const fOp=fOpts(ing?.fornitoreId);
  const uOp=uOpts(ing?.unit||'g');
  return `<div class="ing-card" id="ic-${idx}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span class="ing-card-hd">Ingrediente ${idx+1}</span>
      <button type="button" class="ing-del" onclick="rmIngCard(${idx})">×</button>
    </div>
    <input class="form-input" id="in-${idx}" placeholder="Nome ingrediente (es. Riso Carnaroli)" value="${ing?ing.nome:''}" autocomplete="off">
    <div class="ing-row2">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px">MODALITÀ</div>
        <select class="form-input" id="im-${idx}">
          <option value="pp" ${m==='pp'?'selected':''}>Per persona</option>
          <option value="tot" ${m==='tot'?'selected':''}>Qtà fissa totale</option>
        </select>
      </div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px">QUANTITÀ</div>
        <input class="form-input" type="number" inputmode="decimal" id="iq-${idx}" value="${ing?ing.qta:''}" placeholder="${m==='pp'?'es. 80':'es. 500'}" style="text-align:right;font-family:var(--mono)">
      </div>
    </div>
    <div class="ing-row2">
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px">UNITÀ</div>
        <select class="form-input" id="iu-${idx}">${uOp}</select>
      </div>
      <div>
        <div style="font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px">FORNITORE</div>
        <select class="form-input" id="if-${idx}">${fOp}</select>
      </div>
    </div>
  </div>`;
}

function addIngCard(){
  const idx=window._ic++;
  const div=document.createElement('div');
  div.innerHTML=ingCardHTML(idx);
  document.getElementById('ing-builder').appendChild(div.firstElementChild);
  // scroll to new card
  setTimeout(()=>{const el=document.getElementById('ic-'+idx);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},100);
}
function rmIngCard(idx){const el=document.getElementById('ic-'+idx);if(el)el.remove();}
function toggleAltUI(){
  const a=document.getElementById('r-isalt').checked;
  const w=document.getElementById('gen-wrap');if(w)w.style.display=a?'block':'none';
}

function salvaRic(editId){
  const nome=document.getElementById('r-nome').value.trim();
  if(!nome){alert('Inserisci il nome della ricetta');return;}
  const isAlt=document.getElementById('r-isalt').checked;
  const genSpesa=isAlt?document.getElementById('r-genspesa').checked:true;
  const ingredienti=[];
  document.querySelectorAll('[id^="ic-"]').forEach(card=>{
    const idx=card.id.split('-')[1];
    const n=document.getElementById('in-'+idx)?.value.trim();
    const q=parseFloat(document.getElementById('iq-'+idx)?.value);
    const m=document.getElementById('im-'+idx)?.value||'pp';
    const u=document.getElementById('iu-'+idx)?.value||'g';
    const f=document.getElementById('if-'+idx)?.value||fornitori[0]?.id;
    if(n&&!isNaN(q)&&q>=0)ingredienti.push({nome:n,modo:m,qta:q,unit:u,fornitoreId:f});
  });
  if(!ingredienti.length){alert('Aggiungi almeno un ingrediente');return;}
  const altLabelEl=document.getElementById('r-altlabel');
  const altLabel=altLabelEl?altLabelEl.value:'';
  const ric={id:editId||uid(),nome,portata:document.getElementById('r-portata').value,isAlt,genSpesa,altLabel,note:document.getElementById('r-note').value.trim(),ingredienti};
  if(editId){const i=ricette.findIndex(x=>x.id===editId);if(i>=0)ricette[i]=ric;}
  else{ricette.push(ric);openP[ric.portata]=true;}
  closeM();renderPortate();save();
}

// ════════════════════════
// SPESA
// ════════════════════════
function ricalcola(){
  const aggr={};
  ricette.filter(r=>!r.isAlt||r.genSpesa).forEach(r=>{
    r.ingredienti?.forEach(i=>{
      const key=(i.nome+'|'+i.unit+'|'+i.modo).toLowerCase();
      const fid=i.fornitoreId||fornitori[0]?.id;
      if(aggr[key]&&i.modo==='pp')aggr[key].qta+=i.qta;
      else if(!aggr[key])aggr[key]={id:'s'+uid(),nome:i.nome,modo:i.modo,qta:i.qta,unit:i.unit||'g',fornitoreId:fid,checked:false,prezzo:null,extraQta:0,extraUnit:i.unit||'g'};
    });
  });
  const prev={};spesaItems.forEach(s=>prev[(s.nome+'|'+s.unit+'|'+s.modo).toLowerCase()]=s);
  spesaItems=Object.values(aggr).map(s=>{
    const p=prev[(s.nome+'|'+s.unit+'|'+s.modo).toLowerCase()];
    return{...s,checked:p?p.checked:false,prezzo:p?p.prezzo:null,extraQta:p?p.extraQta:0,extraUnit:p?p.extraUnit:s.unit};
  });
  save();
}

function renderSpesa(){
  const c=totCop();
  const sub=document.getElementById('spesa-sub');if(sub)sub.textContent=`${c} coperti`;
  const pb=document.getElementById('pane-bar');
  if(pb)pb.innerHTML=pane.on?`<div class="pane-banner">Pane — da comprare q.b.${pane.note?' ('+pane.note+')':''}</div>`:'';
  const ch=document.getElementById('s-chips');
  if(ch)ch.innerHTML=`<button class="chip${filtroF==='tutti'?' on':''}" onclick="setF('tutti')">Tutti (${spesaItems.length})</button>`
    +fornitori.map(f=>{const n=spesaItems.filter(s=>s.fornitoreId===f.id).length;
      return n?`<button class="chip${filtroF===f.id?' on':''}" onclick="setF('${f.id}')">${f.nome} (${n})</button>`:''}).join('');
  const filtered=filtroF==='tutti'?spesaItems:spesaItems.filter(s=>s.fornitoreId===filtroF);
  const body=document.getElementById('s-body');
  if(!filtered.length){body.innerHTML='<div class="empty">Nessun ingrediente.<br>Aggiungi ricette nel menu.</div>';renderExRows();updTotS();return;}
  const grp={};fornitori.forEach(f=>grp[f.id]=[]);
  filtered.forEach(s=>{if(!grp[s.fornitoreId])grp[s.fornitoreId]=[];grp[s.fornitoreId].push(s);});
  let html='';
  fornitori.forEach(f=>{
    const items=grp[f.id];if(!items?.length)return;
    html+=`<div class="forn-block" style="border:.5px solid var(--sep)">
      <div class="forn-block-hd" style="color:${f.color}">${f.nome}</div>
      ${items.map(s=>{
        const base=s.modo==='tot'?s.qta:s.qta*c;
        const fin=calcFin(s);
        const hasEx=(s.extraQta||0)>0;
        return `<div class="spesa-row">
          <div class="s-check${s.checked?' on':''}" onclick="togChk('${s.id}',${!s.checked})"></div>
          <div style="flex:1;min-width:0">
            <div class="${s.checked?'s-name done':'s-name'}">${s.nome}</div>
            <div style="font-size:13px;color:var(--t3)">${fQ(base,s.unit)}${hasEx?' + extra':''}</div>
          </div>
          <div class="s-qty-col">
            <span class="s-qty${hasEx?'':' base'}">${fQ(fin,s.unit)}</span>
            <div class="s-extra">
              <span style="font-size:11px;color:var(--t3)">+</span>
              <input type="number" min="0" step="0.1" value="${s.extraQta||''}" placeholder="0" oninput="updEx('${s.id}',this.value)">
              <select onchange="updExU('${s.id}',this.value)">${uOpts(s.extraUnit||s.unit)}</select>
            </div>
          </div>
          <div class="s-price"><input type="number" placeholder="€" min="0" step="0.01" value="${s.prezzo||''}" oninput="updPrz('${s.id}',this.value)"></div>
        </div>`;}).join('')}
    </div>`;
  });
  body.innerHTML=html;renderExRows();updTotS();
}
function setF(id){filtroF=id;renderSpesa();}
function togChk(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.checked=v;save();renderSpesa();}}
function updEx(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.extraQta=parseFloat(v)||0;save();}updTotS();}
function updExU(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.extraUnit=v;save();}}
function updPrz(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.prezzo=parseFloat(v)||null;save();}updTotS();}
function updTotS(){
  const t=spesaItems.reduce((a,s)=>a+(s.prezzo||0),0)+spesaExtra.reduce((a,e)=>a+(e.prezzo||0),0);
  const el=document.getElementById('s-tot');if(el)el.textContent=eur(t);
  const cpp=document.getElementById('s-cpp');const c=totCop();
  if(cpp)cpp.textContent=t>0&&c>0?`${eur(t/c)} per coperto`:'';
}

function scaricaPDF(){
  const c = totCop();
  const titolo = eventoTitolo || 'Lista della spesa';
  const data = new Date().toLocaleDateString('it-IT');
  const altN = totAlt();

  // Costruisci HTML per ogni fornitore
  let fornHtml = '';
  if(pane.on){
    fornHtml += `<div class="pane-box">Pane — da comprare q.b.${pane.note?' ('+pane.note+')':''}</div>`;
  }

  fornitori.forEach(f=>{
    const items = spesaItems.filter(s=>s.fornitoreId===f.id);
    const extra = spesaExtra.filter(e=>e.fornitoreId===f.id);
    const all = [...items,...extra.map(e=>({...e,_ex:true}))];
    if(!all.length) return;
    let rows = all.map(s=>{
      const isEx = !!s._ex;
      const qty = isEx ? (s.qta?`${s.qta} ${s.unit}`:'—') : fQ(calcFin(s),s.unit);
      const nome = s.nome||'—';
      return `<tr>
        <td class="chk"><div class="box"></div></td>
        <td class="name">${nome}</td>
        <td class="qty">${qty}</td>
      </tr>`;
    }).join('');
    fornHtml += `<div class="forn-section">
      <div class="forn-title" style="color:${f.color}">${f.nome}</div>
      <table><tbody>${rows}</tbody></table>
    </div>`;
  });

  // extra senza fornitore assegnato a fornitore esistente
  const extraOrphans = spesaExtra.filter(e=>!fornitori.find(f=>f.id===e.fornitoreId));
  // (ignorati se non ci sono)

  const totV = spesaItems.reduce((a,s)=>a+(s.prezzo||0),0)+spesaExtra.reduce((a,e)=>a+(e.prezzo||0),0);
  const totHtml = totV>0 ? `<div class="totale">Totale stimato: <strong>${eur(totV)}</strong>${c>0?' — '+eur(totV/c)+' per coperto':''}</div>` : '';

  const html = `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${titolo} — Lista spesa</title>

  --green:#34C759;
  --green-bg:rgba(52,199,89,.10);
  --red:#FF3B30;
  --red-bg:rgba(255,59,48,.09);
  --orange:#FF9500;
  --orange-bg:rgba(255,149,0,.10);
  /* type */

      <input type="number" inputmode="decimal" value="${e.qta||''}" style="width:60px;font-size:15px;text-align:right;border:.5px solid var(--sep);border-radius:7px;padding:6px 7px;background:var(--card2);color:var(--t1);outline:none;-webkit-appearance:none;font-family:var(--mono)" oninput="updEI('${e.id}','qta',parseFloat(this.value)||0)">
      <select style="font-size:14px;border:.5px solid var(--sep);border-radius:7px;padding:6px;background:var(--card2);color:var(--t1);outline:none;-webkit-appearance:none" onchange="updEI('${e.id}','unit',this.value)">${uOpts(e.unit||'pz')}</select>
      <select style="font-size:13px;border:.5px solid var(--sep);border-radius:7px;padding:6px;background:var(--card2);color:var(--t1);outline:none;-webkit-appearance:none;max-width:110px" onchange="updEI('${e.id}','fornitoreId',this.value)">${fOpts(e.fornitoreId)}</select>
      <button onclick="delEI('${e.id}')" style="background:none;border:none;color:var(--red);font-size:22px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0">×</button>
    </div>`).join('');
}
function addExRow(){spesaExtra.push({id:'x'+uid(),nome:'',qta:null,unit:'pz',fornitoreId:fornitori[0]?.id,prezzo:null});renderExRows();save();}

// COSTI per fornitore
// ════════════════════════
// fornCosti: {[fornId]: {modo:'singolo'|'totale', totaleManuale:null}}
let fornCosti = {};

function renderCosti(){
  const el = document.getElementById('costi-forn-list'); if(!el) return;
  const all = [...spesaItems,...spesaExtra];
  if(!all.length){
    el.innerHTML='<div class="list-group"><div class="list-row" style="color:var(--t3)">Vai alla tab Spesa, aggiungi ricette e clicca Ricalcola.</div></div>';
    updTotC(); return;
  }
  let html='';
  fornitori.forEach(f=>{
    const items = spesaItems.filter(s=>s.fornitoreId===f.id);
    const extra = spesaExtra.filter(e=>e.fornitoreId===f.id);
    const all2 = [...items,...extra.map(e=>({...e,_ex:true}))];
    if(!all2.length) return;
    if(!fornCosti[f.id]) fornCosti[f.id]={modo:'singolo',totaleManuale:null};
    const fc = fornCosti[f.id];
    const totSingoli = all2.reduce((a,s)=>a+(s.prezzo||0),0);
    const totEff = fc.modo==='totale'&&fc.totaleManuale!=null ? fc.totaleManuale : totSingoli;
    html += `<div class="forn-cost-block">
      <div style="padding:12px 16px;border-bottom:.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:14px;font-weight:700;color:${f.color}">${f.nome}</span>
        <div style="display:flex;gap:0;border:.5px solid var(--sep);border-radius:7px;overflow:hidden">
          <button onclick="setFornMode('${f.id}','singolo')" class="mode-btn ${fc.modo==='singolo'?'on':'off'}">Per articolo</button>
          <button onclick="setFornMode('${f.id}','totale')" class="mode-btn ${fc.modo==='totale'?'on':'off'}">Totale</button>
        </div>
      </div>
      ${fc.modo==='singolo' ? `
        ${all2.map(s=>{
          const isEx=!!s._ex;
          const qty=isEx?(s.qta?`${s.qta} ${s.unit}`:'—'):fQ(calcFin(s),s.unit);
          const inputId='cp-'+s.id;
          return `<div class="list-row" style="gap:8px">
            <span style="flex:1;font-size:15px;font-weight:500">${s.nome||'—'}${isEx?' <span class="info-badge ib-gray">extra</span>':''}</span>
            <span style="font-size:13px;color:var(--t3);font-family:var(--mono)">${qty}</span>
            <input type="number" placeholder="€" min="0" step="0.01" value="${s.prezzo||''}"
              id="${inputId}"
              style="width:82px;padding:8px 10px;font-size:15px;border:.5px solid var(--sep);border-radius:8px;background:var(--sys);color:var(--t1);text-align:right;outline:none;-webkit-appearance:none;font-family:var(--mono)"
              oninput="${isEx?`updEI('${s.id}','prezzo',parseFloat(this.value)||null)`:`updPrz('${s.id}',this.value)`};updTotC()">
          </div>`;}).join('')}
        <div class="list-row" style="background:var(--card2);justify-content:space-between">
          <span style="font-size:14px;font-weight:600;color:var(--t2)">Subtotale ${f.nome}</span>
          <span style="font-family:var(--mono);font-size:16px;font-weight:700">${eur(totSingoli)}</span>
        </div>` : `
        <div class="list-row" style="gap:10px">
          <span style="flex:1;font-size:15px;font-weight:500">Totale speso da ${f.nome}</span>
          <input type="number" placeholder="€" min="0" step="0.01" value="${fc.totaleManuale!=null?fc.totaleManuale:''}"
            style="width:110px;padding:8px 10px;font-size:16px;border:.5px solid var(--sep);border-radius:8px;background:var(--sys);color:var(--t1);text-align:right;outline:none;-webkit-appearance:none;font-family:var(--mono)"
            oninput="fornCosti['${f.id}'].totaleManuale=parseFloat(this.value)||null;save();updTotC()">
        </div>
        <div class="list-row" style="background:var(--card2)">
          <span style="flex:1;font-size:13px;color:var(--t3)">${all2.length} articoli acquistati</span>
          <span style="font-size:13px;color:var(--t3)">${all2.map(s=>s.nome).join(', ')}</span>
        </div>`}
    </div>`;
  });
  el.innerHTML = html || '<div class="list-group"><div class="list-row" style="color:var(--t3)">Nessun fornitore con articoli.</div></div>';
  updTotC();
}

function setFornMode(id, modo){
  if(!fornCosti[id]) fornCosti[id]={modo:'singolo',totaleManuale:null};
  fornCosti[id].modo=modo;
  save(); renderCosti();
}

function updTotC(){
  let t=0;
  fornitori.forEach(f=>{
    const fc=fornCosti[f.id]||{modo:'singolo'};
    if(fc.modo==='totale'&&fc.totaleManuale!=null){
      t+=fc.totaleManuale;
    } else {
      const items=spesaItems.filter(s=>s.fornitoreId===f.id);
      const extra=spesaExtra.filter(e=>e.fornitoreId===f.id);
      t+=[...items,...extra].reduce((a,s)=>a+(s.prezzo||0),0);
    }
  });
  const c=totCop();
  const el=document.getElementById('c-tot');if(el)el.textContent=eur(t);
  const cpp=document.getElementById('c-cpp');if(cpp)cpp.textContent=t>0&&c>0?`${eur(t/c)} per coperto`:'';
}

function scaricaPDFCosti(){
  const c=totCop();
  const titolo=eventoTitolo||'Riepilogo costi';
  const data=new Date().toLocaleDateString('it-IT');
  let totGlobale=0;
  let fornHtml='';

// ════════════════════════
// OSPITI
// ════════════════════════
function renderOspiti(){
  const sum=document.getElementById('allsum');
  const cnt={};ospiti.forEach(o=>o.allergie.forEach(a=>{cnt[a]=(cnt[a]||0)+1;}));
  sum.innerHTML=Object.entries(cnt).map(([id,n])=>{const i=aInfo(id);return `<div class="as-item"><span class="atag ${i.cls}">${i.label}</span><span class="as-n">${n}</span></div>`;}).join('');
  const el=document.getElementById('ospiti-list');
  if(!ospiti.length){el.innerHTML='<div class="list-row" style="color:var(--t3)">Nessun ospite aggiunto</div>';return;}
  el.innerHTML=ospiti.map(o=>`<div class="ospite-item">
    <div class="ospite-row">
      <div class="ospite-name">${o.nome}${o.tavolo?` <span style="font-size:13px;color:var(--t3);font-weight:400">${o.tavolo}</span>`:''}</div>
      <button class="btn-text" style="font-size:14px" onclick="openAddOspite('${o.id}')">Modifica</button>
      <button class="btn-text btn-text-red" style="font-size:14px" onclick="delOspite('${o.id}')">Rimuovi</button>
    </div>
    ${o.allergie.length?`<div class="ospite-tags">${o.allergie.map(a=>{const i=aInfo(a);return `<span class="atag ${i.cls}">${i.label}</span>`;}).join('')}</div>`:''}
    ${o.note?`<div style="padding:0 16px 12px;font-size:13px;color:var(--t3);font-style:italic">${o.note}</div>`:''}
  </div>`).join('');
  renderAlt();
}
function openAddOspite(editId){
  const o=editId?ospiti.find(x=>x.id===editId):null;
  const checks=ALLERGIE.map(a=>`
    <label style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:.5px solid var(--sep);cursor:pointer">
      <input type="checkbox" value="${a.id}" ${o&&o.allergie.includes(a.id)?'checked':''} style="width:22px;height:22px;accent-color:var(--blue);cursor:pointer;flex-shrink:0">
      <span class="atag ${a.cls}" style="font-size:14px">${a.label}</span>
    </label>`).join('');
  setModal(o?'Modifica ospite':'Nuovo ospite',`
    <div class="form-row2">
      <div class="form-field"><label class="form-label">Nome</label><input class="form-input" id="o-n" value="${o?o.nome:''}" placeholder="es. Mario Rossi"></div>
      <div class="form-field"><label class="form-label">Tavolo</label><input class="form-input" id="o-t" value="${o?o.tavolo||'':''}" placeholder="es. Tavolo 3"></div>
    </div>
    <div class="form-field">
      <label class="form-label">Allergie e preferenze</label>
      <div style="background:var(--card2);border-radius:10px;overflow:hidden" id="a-chk">${checks}</div>
    </div>
    <div class="form-field"><label class="form-label">Note</label><input class="form-input" id="o-note" value="${o?o.note||'':''}" placeholder="es. menu bambino…"></div>
  `,`<button class="btn btn-secondary" onclick="closeM()">Annulla</button><button class="btn btn-primary" onclick="salvaOspite('${editId||''}')">Salva</button>`);
}
function salvaOspite(editId){
  const nome=document.getElementById('o-n').value.trim();if(!nome){alert('Inserisci il nome');return;}
  const data={nome,tavolo:document.getElementById('o-t').value.trim(),allergie:[...document.querySelectorAll('#a-chk input[type=checkbox]:checked')].map(x=>x.value).filter(Boolean),note:document.getElementById('o-note').value.trim()};
  if(editId){const i=ospiti.findIndex(x=>x.id===editId);if(i>=0)ospiti[i]={id:editId,...data};}
  else ospiti.push({id:uid(),...data});
  closeM();renderOspiti();save();
}
function delOspite(id){if(!confirm('Rimuovere?'))return;ospiti=ospiti.filter(o=>o.id!==id);renderOspiti();save();}

// ════════════════════════
// STORICO
// ════════════════════════
function salvaEvento(){
  if(!ricette.length&&!pane.on){alert('Aggiungi almeno una ricetta.');return;}
  setModal('Salva evento',`
    <div class="form-field"><label class="form-label">Nome evento</label><input class="form-input" id="ev-n" placeholder="es. Cena di Primavera 2026"></div>
    <div class="form-row2">
      <div class="form-field"><label class="form-label">Data</label><input class="form-input" id="ev-d" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="form-field"><label class="form-label">Coperti</label><input class="form-input" id="ev-c" type="number" value="${totCop()}" style="background:var(--card2)" readonly></div>
    </div>
    <div class="form-field"><label class="form-label">Note (opzionale)</label><input class="form-input" id="ev-note" placeholder="note libere"></div>
  `,`<button class="btn btn-secondary" onclick="closeM()">Annulla</button><button class="btn btn-primary" onclick="confSalvaEv()">Salva</button>`);
}
function confSalvaEv(){
  const nome=document.getElementById('ev-n').value.trim();if(!nome){alert('Inserisci il nome');return;}
  const totS=spesaItems.reduce((a,s)=>a+(s.prezzo||0),0)+spesaExtra.reduce((a,e)=>a+(e.prezzo||0),0);
  storico.unshift({id:uid(),nome,data:document.getElementById('ev-d').value,coperti:totCop(),det:{...det},altRapido:JSON.parse(JSON.stringify(altRapido)),note:document.getElementById('ev-note').value.trim(),ricette:JSON.parse(JSON.stringify(ricette)),pane:{...pane},ospiti:JSON.parse(JSON.stringify(ospiti)),totSpesa:totS,titolo:eventoTitolo});
  closeM();save();alert('Evento salvato!');
}
function renderStorico(){
  const c=document.getElementById('stor-body');
  if(!storico.length){c.innerHTML='<div class="list-row" style="color:var(--t3)">Nessun evento salvato</div>';return;}
  c.innerHTML=storico.map(ev=>`<div class="ev-item" onclick="viewEvento('${ev.id}')">
    <span class="ev-date">${ev.data?new Date(ev.data).toLocaleDateString('it-IT'):'—'}</span>
    <div class="ev-name">${ev.nome}${ev.note?`<div style="font-size:13px;color:var(--t3)">${ev.note}</div>`:''}</div>
    <div class="ev-badges">
      <span class="badge badge-blue">${ev.coperti}</span>
      ${ev.totSpesa?`<span class="badge badge-gray">${eur(ev.totSpesa)}</span>`:''}
    </div>
    <button onclick="event.stopPropagation();delEv('${ev.id}')" style="background:none;border:none;color:var(--red);font-size:22px;cursor:pointer;padding:6px;flex-shrink:0;line-height:1">×</button>
  </div>`).join('');
}
function viewEvento(id){
  const ev=storico.find(x=>x.id===id);if(!ev)return;
  setModal(ev.nome,`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
      <span class="badge badge-blue">${ev.data?new Date(ev.data).toLocaleDateString('it-IT'):'—'}</span>
      <span class="badge badge-blue">${ev.coperti} coperti</span>
      ${ev.totSpesa?`<span class="badge badge-gray">${eur(ev.totSpesa)}</span>`:''}
      ${ev.totSpesa&&ev.coperti?`<span class="badge badge-gray">${eur(ev.totSpesa/ev.coperti)}/cop.</span>`:''}
    </div>
    <div style="font-size:13px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Menu</div>
    <div style="font-size:16px;line-height:2">
      ${PORTATE.map(p=>{const s=ev.ricette.filter(x=>x.portata===p.id&&!x.isAlt);const a=ev.ricette.filter(x=>x.portata===p.id&&x.isAlt);if(!s.length&&!a.length)return '';return `<b>${p.label}:</b> ${s.map(x=>x.nome).join(', ')}${a.length?` · <span style="color:var(--orange)">alt: ${a.map(x=>x.nome).join(', ')}</span>`:''}`}).filter(Boolean).join('<br>')}
      ${ev.pane?.on?'<br><b>Pane:</b> da comprare':''}
    </div>
    ${ev.note?`<div style="font-size:14px;color:var(--t3);font-style:italic;margin-top:12px">${ev.note}</div>`:''}
  `,`<button class="btn btn-secondary" onclick="ricaricaEv('${ev.id}')">Ricarica menu</button><button class="btn btn-primary" onclick="closeM()">Chiudi</button>`);
}
function ricaricaEv(id){
  const ev=storico.find(x=>x.id===id);if(!ev)return;
  if(!confirm('Sovrascrive il menu corrente?'))return;
  ricette=JSON.parse(JSON.stringify(ev.ricette));
  if(ev.pane)pane={...ev.pane};
  if(ev.det){det={...ev.det};['adulti','bambini','cucina'].forEach(k=>{const el=document.getElementById('c-'+k);if(el)el.value=det[k]||0;});}
  if(ev.altRapido)altRapido=JSON.parse(JSON.stringify(ev.altRapido));
  eventoTitolo=ev.titolo||ev.nome||'';
  const eti=document.getElementById('ev-title-input');if(eti)eti.value=eventoTitolo;
  closeM();
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.s==='menu'));
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById('s-menu').classList.add('on');
  renderPortate();renderAlt();save();window.scrollTo(0,0);
}
function delEv(id){if(!confirm('Eliminare?'))return;storico=storico.filter(x=>x.id!==id);renderStorico();save();}

// ════════════════════════
// FORNITORI
// ════════════════════════
function renderFornitori(){
  const c=document.getElementById('forn-body');
  if(!fornitori.length){c.innerHTML='<div class="list-row" style="color:var(--t3)">Nessun fornitore</div>';return;}
  c.innerHTML=fornitori.map(f=>{
    const n=spesaItems.filter(s=>s.fornitoreId===f.id).length+spesaExtra.filter(e=>e.fornitoreId===f.id).length;
    return `<div class="list-row">
      <div style="width:12px;height:12px;border-radius:50%;background:${f.color};flex-shrink:0"></div>
      <span style="flex:1;font-size:16px;font-weight:500">${f.nome}</span>
      <span style="font-size:14px;color:var(--t3)">${n} articoli</span>
      <button class="btn-text btn-text-red" onclick="delForn('${f.id}')">Elimina</button>
    </div>`;}).join('');
}
function openAddForn(){
  setModal('Nuovo fornitore',`
    <div class="form-field"><label class="form-label">Nome fornitore</label><input class="form-input" id="fn-n" placeholder="es. Macelleria Rossi"></div>
    <div class="form-field"><label class="form-label">Colore</label><input id="fn-c" type="color" value="#007AFF" style="width:60px;height:48px;padding:4px;cursor:pointer;border:none;border-radius:10px;background:none"></div>
  `,`<button class="btn btn-secondary" onclick="closeM()">Annulla</button><button class="btn btn-primary" onclick="salveForn()">Salva</button>`);
}
function salveForn(){
  const n=document.getElementById('fn-n').value.trim();if(!n)return;
  fornitori.push({id:'f'+uid(),nome:n,color:document.getElementById('fn-c').value});
  closeM();renderFornitori();save();
}
function delForn(id){if(!confirm('Eliminare?'))return;fornitori=fornitori.filter(f=>f.id!==id);renderFornitori();save();}

// ════════════════════════
// MODAL
// ════════════════════════
function setModal(title,body,footer){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').innerHTML=body;
  document.getElementById('m-footer').innerHTML=footer||'';
  document.getElementById('modal-overlay').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeM(){
  document.getElementById('modal-overlay').classList.remove('on');
  document.body.style.overflow='';
  window._ic=0;
}
function bgck(e){if(e.target===document.getElementById('modal-overlay'))closeM();}

// INIT
// ════════════════════════
load();
['adulti','bambini','cucina'].forEach(k=>{
  const el=document.getElementById('c-'+k);
  if(el)el.value=det[k]||0;
});
// ripristina titolo
const etiInit=document.getElementById('ev-title-input');
if(etiInit)etiInit.value=eventoTitolo||'';
updCopDisplay();
renderPortate();
renderAlt();
</script>
