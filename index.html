<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cucina">
<title>Cucina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --card2:#F2F2F7;
  --sep:rgba(60,60,67,.18);
  --sep2:rgba(60,60,67,.08);
  --label:rgba(60,60,67,.6);
  --blue:#007AFF;
  --green:#34C759;
  --red:#FF3B30;
  --orange:#FF9500;
  --gray:#8E8E93;
  --gray2:#AEAEB2;
  --tx:#000;
  --tx2:rgba(0,0,0,.55);
  --tx3:rgba(0,0,0,.3);
  --nav-h:49px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --mono:-apple-system-monospaced,ui-monospace,'SF Mono',monospace;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;--card:#1C1C1E;--card2:#2C2C2E;
    --sep:rgba(255,255,255,.15);--sep2:rgba(255,255,255,.06);
    --label:rgba(255,255,255,.55);--tx:#fff;--tx2:rgba(255,255,255,.55);--tx3:rgba(255,255,255,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;font-size:17px}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,sans-serif;
  background:var(--bg);color:var(--tx);
  min-height:100%;
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom));
}

/* ── NAV BAR ── */
.nav{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--nav-h) + var(--safe-bottom));
  background:rgba(249,249,249,.94);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-top:1px solid var(--sep2);
  display:flex;align-items:flex-start;padding-top:8px;
  z-index:100;
}
@media(prefers-color-scheme:dark){.nav{background:rgba(28,28,30,.94);}}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;font-family:inherit;color:var(--gray);padding:0 4px}
.nav-tab.on{color:var(--blue)}
.nav-tab svg{width:24px;height:24px;stroke-width:1.8}
.nav-label{font-size:10px;font-weight:500;letter-spacing:.01em}

/* ── HEADER ── */
.page-hd{
  padding:52px 20px 8px;
  background:var(--bg);
  position:sticky;top:0;z-index:50;
}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.5px}
.page-subtitle{font-size:13px;color:var(--tx2);margin-top:3px}

/* ── CONTENT ── */
.screen{display:none;padding:0 0 20px}
.screen.on{display:block}

/* ── SECTIONS ── */
.section{margin:20px 16px 0}
.section-label{font-size:13px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;padding-left:4px}

/* ── CARD LIST (iOS grouped) ── */
.card-list{background:var(--card);border-radius:12px;overflow:hidden}
.card-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--sep2);min-height:48px}
.card-row:last-child{border-bottom:none}
.card-row-label{flex:1;font-size:17px}
.card-row-sub{font-size:13px;color:var(--tx2);margin-top:1px}
.card-row-value{font-size:17px;color:var(--tx2)}
.card-row-action{color:var(--blue);font-size:17px;cursor:pointer;background:none;border:none;font-family:inherit;padding:4px 0}
.card-row-mono{font-family:var(--mono);font-size:17px;font-weight:600}

/* ── COPERTI ── */
.cop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep2)}
.cop-cell{background:var(--card);padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cop-cell-lbl{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
.cop-cell input{
  width:100%;max-width:80px;
  font-size:28px;font-weight:700;font-family:var(--mono);
  text-align:center;color:var(--tx);
  background:var(--card2);
  border:none;border-radius:8px;
  padding:8px 4px;outline:none;
  -webkit-appearance:none;
}
.cop-cell input:focus{background:rgba(0,122,255,.08)}
.cop-total{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--sep2);background:var(--card)}
.cop-total-lbl{font-size:15px;color:var(--tx2)}
.cop-total-n{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--blue)}

/* ── PORTATE ── */
.portata-block{background:var(--card);border-radius:12px;overflow:hidden}
.portata-hd{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--sep2);min-height:52px}
.portata-hd:active{background:var(--card2)}
.portata-name{flex:1;font-size:17px;font-weight:600}
.portata-badges{display:flex;gap:6px}
.pb{font-size:12px;font-weight:600;padding:2px 8px;border-radius:100px}
.pb-g{background:rgba(52,199,89,.12);color:#1a8c3a}
.pb-o{background:rgba(255,149,0,.12);color:#b86c00}
@media(prefers-color-scheme:dark){
  .pb-g{color:#30d158}.pb-o{color:#ff9f0a}
}
.portata-body{display:none}.portata-body.op{display:block}
.portata-sec-lbl{font-size:12px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.06em;padding:10px 16px 6px;background:var(--card2)}
.ric-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--sep2)}
.ric-row:active{background:var(--card2)}
.ric-info{flex:1;min-width:0}
.ric-name{font-size:16px;font-weight:600}
.ric-meta{font-size:13px;color:var(--tx2);margin-top:2px}
.portata-footer{padding:10px 16px;border-top:1px solid var(--sep2);display:flex;gap:8px;background:var(--card2)}

/* pane switch */
.pane-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--sep2);gap:12px}
.toggle{width:51px;height:31px;border-radius:100px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--green)}.toggle.off{background:var(--gray2)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle.on::after{transform:translateX(20px)}

/* ── ING TABLE (in modal) ── */
.ing-builder{border-radius:10px;overflow:hidden;border:1px solid var(--sep)}
.ing-hdr,.ing-row{display:grid;grid-template-columns:1fr 100px 72px 70px 110px 36px;gap:0}
.ing-hdr{background:var(--card2);border-bottom:1px solid var(--sep2)}
.ing-hdr span,.ing-row-cell{padding:9px 10px;font-size:12px}
.ing-hdr span{font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.ing-row{border-bottom:1px solid var(--sep2)}.ing-row:last-child{border:none}
.ing-row-cell input,.ing-row-cell select{
  width:100%;padding:7px 8px;font-size:13px;
  border:none;background:transparent;color:var(--tx);
  font-family:inherit;outline:none;-webkit-appearance:none;
}
.ing-row-cell select{cursor:pointer}
.ing-add{padding:10px 14px;background:var(--card2);border-top:1px solid var(--sep2)}

/* ── SPESA ── */
.forn-block{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:12px}
.forn-hd{padding:11px 16px;font-size:13px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--sep2);background:var(--card2)}
.spesa-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--sep2)}
.spesa-row:last-child{border:none}
.spesa-row:active{background:var(--card2)}
.s-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gray2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .15s;background:none}
.s-chk.done{background:var(--blue);border-color:var(--blue)}
.s-chk.done::after{content:'';width:12px;height:9px;border-bottom:2px solid #fff;border-left:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);display:block}
.s-name{flex:1;font-size:16px;font-weight:500}.s-name.done{color:var(--tx3);text-decoration:line-through}
.s-qty{font-size:15px;font-family:var(--mono);font-weight:600;color:var(--tx2)}
.s-extra-wrap{display:flex;align-items:center;gap:4px}
.s-extra-wrap input,.s-extra-wrap select{padding:5px 6px;font-size:13px;border:1px solid var(--sep);border-radius:6px;background:var(--card2);color:var(--tx);width:56px;text-align:right;font-family:var(--mono);outline:none;-webkit-appearance:none}
.s-extra-wrap select{width:52px}
.s-price input{width:76px;padding:6px 8px;font-size:14px;border:1px solid var(--sep);border-radius:6px;background:var(--card2);color:var(--tx);text-align:right;font-family:var(--mono);outline:none;-webkit-appearance:none;font-family:inherit}

/* pane spesa banner */
.pane-banner{background:var(--card);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:500;color:var(--orange);border-left:4px solid var(--orange);margin-bottom:12px}

/* total row */
.total-row{background:var(--card);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.total-label{font-size:15px;color:var(--tx2);font-weight:500}
.total-n{font-size:26px;font-weight:700;font-family:var(--mono)}

/* chips */
.chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:100px;border:1px solid var(--sep);font-size:14px;cursor:pointer;background:var(--card);color:var(--tx2);font-family:inherit;font-weight:500;white-space:nowrap}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ── OSPITI ── */
.ospite-card{border-bottom:1px solid var(--sep2)}
.ospite-card:last-child{border:none}
.o-row{display:flex;align-items:center;gap:12px;padding:13px 16px}
.o-name{flex:1;font-size:16px;font-weight:600}
.o-tags{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 12px}
.atag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:100px}
.a-cel{background:rgba(255,149,0,.12);color:#b86c00}
.a-lat{background:rgba(0,122,255,.1);color:#0060cc}
.a-fru{background:rgba(255,59,48,.1);color:#cc2000}
.a-veg{background:rgba(52,199,89,.1);color:#1a8c3a}
.a-vgt{background:rgba(48,209,88,.1);color:#1a8c3a}
.a-uov{background:rgba(255,149,0,.12);color:#b86c00}
.a-pes{background:rgba(0,122,255,.1);color:#0060cc}
.a-cro{background:rgba(255,59,48,.1);color:#cc2000}
.a-soi{background:rgba(88,86,214,.1);color:#4040b0}
.a-alt{background:rgba(142,142,147,.1);color:var(--gray)}
@media(prefers-color-scheme:dark){
  .a-cel{color:#ff9f0a}.a-lat{color:#0a84ff}.a-fru{color:#ff453a}
  .a-veg{color:#30d158}.a-vgt{color:#30d158}.a-uov{color:#ff9f0a}
  .a-pes{color:#0a84ff}.a-cro{color:#ff453a}.a-soi{color:#7b7bff}.a-alt{color:#8e8e93}
}
.all-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.as-item{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:8px;padding:7px 11px}
.as-n{font-size:18px;font-weight:700;font-family:var(--mono)}

/* ── STORICO ── */
.ev-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--sep2);cursor:pointer}
.ev-row:last-child{border:none}
.ev-row:active{background:var(--card2)}
.ev-date{font-size:13px;color:var(--tx2);font-family:var(--mono);min-width:80px}
.ev-name{flex:1;font-size:16px;font-weight:600}
.ev-badges{display:flex;gap:5px}

/* ── MODAL ── */
.modal-bg{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;
}
.modal-bg.on{display:flex}
.modal{
  background:var(--bg);
  border-radius:20px 20px 0 0;
  width:100%;
  max-height:92vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(20px + var(--safe-bottom));
  animation:slideup .25s cubic-bezier(.32,0,.67,0);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--sep);border-radius:2px;margin:12px auto 4px}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 12px;position:sticky;top:0;background:var(--bg);z-index:1;border-bottom:1px solid var(--sep2)}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:none;border:none;color:var(--blue);font-size:17px;cursor:pointer;font-family:inherit;padding:4px}
.modal-body{padding:16px 20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--sep2);display:flex;gap:10px;justify-content:flex-end}
.sep-line{height:1px;background:var(--sep2);margin:14px 0}

/* ── FORMS ── */
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;display:block}
.form-input{
  width:100%;padding:12px 14px;
  font-size:17px;font-family:inherit;
  background:var(--card2);color:var(--tx);
  border:none;border-radius:10px;outline:none;
  -webkit-appearance:none;
}
.form-input:focus{background:rgba(0,122,255,.06)}
select.form-input{cursor:pointer}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-checkbox{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card2);border-radius:10px;cursor:pointer}
.form-checkbox input{width:20px;height:20px;accent-color:var(--blue);cursor:pointer}
.form-checkbox-label{font-size:16px;font-weight:500}

/* ── BUTTONS ── */
.btn-ios{
  padding:13px 20px;border-radius:12px;
  font-size:16px;font-weight:600;font-family:inherit;
  border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:opacity .15s;
}
.btn-ios:active{opacity:.75}
.btn-primary{background:var(--blue);color:#fff}
.btn-secondary{background:var(--card2);color:var(--blue)}
.btn-danger-soft{background:rgba(255,59,48,.1);color:var(--red)}
.btn-sm-ios{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;border:none;cursor:pointer;transition:opacity .15s}
.btn-sm-ios:active{opacity:.7}
.btn-inline{background:none;border:none;color:var(--blue);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;padding:4px;-webkit-tap-highlight-color:transparent}
.btn-inline-red{color:var(--red)}

/* ── MISC ── */
.empty{text-align:center;padding:48px 20px;color:var(--tx3);font-size:15px}
.info-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:100px;font-size:13px;font-weight:600}
.ic-blue{background:rgba(0,122,255,.1);color:var(--blue)}
.ic-green{background:rgba(52,199,89,.12);color:#1a8c3a}
.ic-gray{background:rgba(142,142,147,.1);color:var(--gray)}
@media(prefers-color-scheme:dark){.ic-green{color:#30d158}}

/* ── PRINT ── */
@media print{
  .nav,.no-print{display:none!important}
  body{padding:0;background:#fff;color:#000}
  .screen{display:none!important}
  #s-screen{display:block!important}
  .page-hd{position:static;padding:0 0 12px;border-bottom:2px solid #000;margin-bottom:16px}
  .page-title{font-size:18px}.page-subtitle{font-size:12px}
  .chips,.s-extra-wrap,.s-price,.pane-banner+*{display:none!important}
  .pane-banner{display:block!important;border:1px solid #ccc;padding:7px 12px;background:#fff!important;font-size:12px;color:#000}
  .forn-block{break-inside:avoid;margin-bottom:14px;border:1px solid #ccc;border-radius:4px}
  .forn-hd{font-size:12px;padding:7px 12px;background:#f5f5f5!important;color:#000!important}
  .spesa-row{padding:7px 12px;border-bottom:1px solid #eee}
  .s-chk{display:block;width:14px;height:14px;border-radius:2px;border:1.5px solid #999;background:#fff}
  .s-qty{font-size:13px}
  .total-row{display:none!important}
}
</style>
</head>

<!-- ══ MENU ══ -->
<div id="s-menu" class="screen on">
  <div class="page-hd">
    <div class="page-title">Menu del giorno</div>
    <div class="page-subtitle" id="menu-sub">Configura i coperti</div>
  </div>

  <!-- Coperti -->
  <div class="section">
    <div class="section-label">Coperti</div>
    <div style="background:var(--card);border-radius:12px;overflow:hidden">
      <div class="cop-grid">
        <div class="cop-cell">
          <div class="cop-cell-lbl">Adulti</div>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="c-adulti" value="50" min="0" oninput="setCop('adulti',this.value)">
        </div>
        <div class="cop-cell">
          <div class="cop-cell-lbl">Bambini</div>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="c-bambini" value="0" min="0" oninput="setCop('bambini',this.value)">
        </div>
        <div class="cop-cell">
          <div class="cop-cell-lbl">Cucina</div>
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="c-cucina" value="0" min="0" oninput="setCop('cucina',this.value)">
        </div>
      </div>
      <div class="cop-total">
        <span class="cop-total-lbl">Totale coperti</span>
        <span class="cop-total-n" id="cop-tot-n">50</span>
      </div>
    </div>
  </div>

  <!-- Alt rapido -->
  <div class="section">
    <div class="section-label">Menu alternativi</div>

    <button class="btn-inline" style="margin-top:8px;padding-left:4px" onclick="addAlt()">+ Aggiungi tipo</button>

    <div class="total-row" style="margin-top:12px">

      <span class="total-n" id="c-tot">€ 0,00</span>
    </div>
  </div>
</div>

    </div>

    <div class="modal-footer" id="m-footer"></div>
  </div>

<script>
// ═══════════════════════════
// CONFIG
// ═══════════════════════════
const PORTATE=[
  {id:'antipasto',label:'Antipasti'},
  {id:'primo',label:'Primi piatti'},
  {id:'secondo',label:'Secondi piatti'},
  {id:'contorno',label:'Contorni'},
  {id:'dolce',label:'Dolce e frutta'}
];
const ALLERGIE=[
  {id:'celiachia',label:'Celiachia / Glutine',cls:'a-cel'},
  {id:'lattosio',label:'Lattosio',cls:'a-lat'},
  {id:'fruttasecca',label:'Frutta secca',cls:'a-fru'},
  {id:'vegano',label:'Vegano',cls:'a-veg'},
  {id:'vegetariano',label:'Vegetariano',cls:'a-vgt'},
  {id:'uova',label:'Uova',cls:'a-uov'},
  {id:'pesce',label:'Pesce',cls:'a-pes'},
  {id:'crostacei',label:'Crostacei',cls:'a-cro'},
  {id:'soia',label:'Soia',cls:'a-soi'},
  {id:'altro',label:'Altro',cls:'a-alt'}
];
const UNITS=['g','kg','ml','l','pz','fette','cucchiai','spicchi'];

// ═══════════════════════════
// STATE
// ═══════════════════════════
let det={adulti:50,bambini:0,cucina:0};
let altRapido=[];
let ricette=[],fornitori=[],ospiti=[],storico=[];
let pane={on:false,note:''};
let spesaItems=[],spesaExtra=[];
let filtroF='tutti',ctabMode='s';
let openP={};

function initF(){
  fornitori=[
    {id:'f1',nome:'Supermercato',color:'#34C759'},
    {id:'f2',nome:'Fornitore carne',color:'#FF3B30'},
    {id:'f3',nome:'Beverage',color:'#007AFF'},
    {id:'f4',nome:'Fresco / Ortofrutta',color:'#FF9500'}
  ];
}

// ═══════════════════════════
// PERSIST
// ═══════════════════════════
function save(){
  try{localStorage.setItem('cucina_v1',JSON.stringify({det,altRapido,ricette,fornitori,spesaItems,spesaExtra,ospiti,storico,pane}));}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('cucina_v1')||'{}');
    if(d.det)det=Object.assign({adulti:50,bambini:0,cucina:0},d.det);
    if(d.altRapido)altRapido=d.altRapido;
    if(d.ricette)ricette=d.ricette;
    if(d.fornitori&&d.fornitori.length)fornitori=d.fornitori;else initF();
    if(d.spesaItems)spesaItems=d.spesaItems;
    if(d.spesaExtra)spesaExtra=d.spesaExtra;
    if(d.ospiti)ospiti=d.ospiti;
    if(d.storico)storico=d.storico;
    if(d.pane)pane=d.pane;
  }catch(e){initF();}
}

// ═══════════════════════════
// UTILS
// ═══════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function eur(n){return '€ '+n.toFixed(2).replace('.',',');}
function fQ(n,u){
  if(n===null||n===undefined||isNaN(n))return '—';
  if(u==='g'&&n>=1000)return (n/1000).toFixed(2)+' kg';
  if(u==='ml'&&n>=1000)return (n/1000).toFixed(2)+' l';
  return (n>=100?Math.round(n):n>=10?parseFloat(n.toFixed(1)):parseFloat(n.toFixed(2)))+'\u202f'+(u||'');
}
function totCop(){return (det.adulti||0)+(det.bambini||0)+(det.cucina||0);}
function calcQ(ing){return ing.modo==='tot'?ing.qta:ing.qta*totCop();}
function calcFin(s){
  const base=s.modo==='tot'?s.qta:s.qta*totCop();
  const ex=s.extraQta||0;const eu=s.extraUnit||s.unit;
  let c=ex;
  if(s.unit==='g'&&eu==='kg')c=ex*1000;else if(s.unit==='kg'&&eu==='g')c=ex/1000;
  else if(s.unit==='ml'&&eu==='l')c=ex*1000;else if(s.unit==='l'&&eu==='ml')c=ex/1000;
  return base+c;
}
function aInfo(id){return ALLERGIE.find(a=>a.id===id)||{label:id,cls:'a-alt'};}
function fInfo(id){return fornitori.find(f=>f.id===id)||{nome:'—',color:'#8E8E93'};}
function uOpts(s){return UNITS.map(u=>`<option value="${u}"${u===s?' selected':''}>${u}</option>`).join('');}
function fOpts(s){return fornitori.map(f=>`<option value="${f.id}"${f.id===s?' selected':''}>${f.nome}</option>`).join('');}

// ═══════════════════════════
// NAVIGATION
// ═══════════════════════════
function goTo(el){
  const s=el.dataset.s;
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById('s-'+s).classList.add('on');
  window.scrollTo({top:0,behavior:'instant'});
  if(s==='spesa'){ricalcola();renderSpesa();}
  if(s==='ospiti')renderOspiti();
  if(s==='forn')renderFornitori();
  if(s==='storico')renderStorico();
  if(s==='costi')renderCList();
}

// ═══════════════════════════
// COPERTI
// ═══════════════════════════
function setCop(k,v){
  det[k]=Math.max(0,parseInt(v)||0);
  const n=totCop();
  document.getElementById('cop-tot-n').textContent=n;
  const ms=document.getElementById('menu-sub');
  if(ms)ms.textContent=`${n} coperti — ${det.adulti} adulti, ${det.bambini} bambini, ${det.cucina} cucina`;
  save();
}

// ═══════════════════════════
// ALT RAPIDO
// ═══════════════════════════
function renderAlt(){
  const el=document.getElementById('alt-list');if(!el)return;
  if(!altRapido.length){el.innerHTML='<div class="card-row" style="color:var(--tx3);font-size:15px">Nessun menu alternativo</div>';return;}
  el.innerHTML=altRapido.map((a,i)=>`
    <div class="card-row">
      <input type="number" inputmode="numeric" value="${a.n}" min="0"
        style="width:52px;font-size:20px;font-weight:700;font-family:var(--mono);text-align:center;border:none;background:var(--card2);border-radius:8px;padding:6px 4px;outline:none;-webkit-appearance:none;color:var(--tx)"
        oninput="altRapido[${i}].n=parseInt(this.value)||0;save()">
      <input type="text" value="${a.label}"
        style="flex:1;font-size:16px;font-weight:500;border:none;background:none;color:var(--tx);outline:none;font-family:inherit"
        oninput="altRapido[${i}].label=this.value;save()">
      <button class="btn-inline btn-inline-red" onclick="altRapido.splice(${i},1);renderAlt();save()">Rimuovi</button>
    </div>`).join('');
  const cnt={};ospiti.forEach(o=>o.allergie.forEach(a=>{cnt[a]=(cnt[a]||0)+1;}));
  const li=document.getElementById('alt-linked');
  if(li){const e=Object.entries(cnt);li.innerHTML=e.length?'Da ospiti: '+e.map(([id,n])=>{const i=aInfo(id);return `<span class="atag ${i.cls}" style="margin-right:4px">${i.label} ${n}</span>`;}).join(''):'';}
}
function addAlt(){altRapido.push({label:'Tipo',n:0});renderAlt();save();}

// ═══════════════════════════
// PORTATE
// ═══════════════════════════
function renderPortate(){
  const c=totCop();
  const ms=document.getElementById('menu-sub');
  if(ms){
    const nS=ricette.filter(r=>!r.isAlt).length;
    const nA=ricette.filter(r=>r.isAlt).length;
    ms.textContent=`${c} coperti${nS?' — '+nS+' ricette':''}`;
  }
  const el=document.getElementById('portate-list');
  el.innerHTML=PORTATE.map(p=>{
    const std=ricette.filter(r=>r.portata===p.id&&!r.isAlt);
    const alt=ricette.filter(r=>r.portata===p.id&&r.isAlt);
    const isO=openP[p.id];
    return `<div class="portata-block">
      <div class="portata-hd" onclick="togP('${p.id}')">
        <span class="portata-name">${p.label}</span>
        <div class="portata-badges">
          ${std.length?`<span class="pb pb-g">${std.length}</span>`:''}
          ${alt.length?`<span class="pb pb-o">alt ${alt.length}</span>`:''}
          ${!std.length&&!alt.length?`<span class="info-chip ic-gray">vuoto</span>`:''}
        </div>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--tx3);flex-shrink:0;transform:rotate(${isO?'180deg':'0deg'});transition:transform .2s"><polyline points="2 4 6 8 10 4"/></svg>
      </div>
      <div class="portata-body ${isO?'op':''}">
        <div class="portata-sec-lbl">Menu standard</div>
        ${std.length===0?`<div class="card-row" style="color:var(--tx3)">Nessuna ricetta</div>`:std.map(r=>ricRow(r,c)).join('')}
        <div class="portata-sec-lbl" style="background:rgba(255,149,0,.06);color:var(--orange)">Menu alternativo</div>
        ${alt.length===0?`<div class="card-row" style="color:var(--tx3)">Nessuno</div>`:alt.map(r=>ricRow(r,c,true)).join('')}
        <div class="portata-footer">
          <button class="btn-sm-ios btn-primary" onclick="openAddRic('${p.id}',false)">+ Standard</button>
          <button class="btn-sm-ios" style="background:rgba(255,149,0,.12);color:var(--orange)" onclick="openAddRic('${p.id}',true)">+ Alternativo</button>
        </div>
      </div>
    </div>`;
  }).join('')+`
  <div class="portata-block" style="margin-top:0">
    <div class="portata-hd" onclick="togP('pane')">
      <span class="portata-name">Pane</span>
      <span class="info-chip ${pane.on?'ic-green':'ic-gray'}">${pane.on?'Da comprare':'Non necessario'}</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--tx3);flex-shrink:0;transform:rotate(${openP['pane']?'180':'0'}deg);transition:transform .2s"><polyline points="2 4 6 8 10 4"/></svg>
    </div>
    <div class="portata-body ${openP['pane']?'op':''}">
      <div class="pane-row">
        <span style="font-size:16px;font-weight:500;flex:1">${pane.on?'Da comprare (q.b.)':'Non necessario'}</span>
        <button class="toggle ${pane.on?'on':'off'}" onclick="pane.on=!pane.on;save();renderPortate()"></button>
      </div>
      ${pane.on?`<div style="padding:0 16px 14px"><input class="form-input" style="font-size:15px;padding:10px 12px" placeholder="Note tipo pane…" value="${pane.note||''}" oninput="pane.note=this.value;save()"></div>`:''}
    </div>
  </div>`;
}
function togP(id){openP[id]=!openP[id];renderPortate();}
function ricRow(r,c,isAlt){
  const spTag=r.isAlt?(r.genSpesa?`<span class="info-chip ic-green" style="font-size:11px">genera spesa</span>`:`<span class="info-chip ic-gray" style="font-size:11px">promemoria</span>`):'';
  return `<div>
    <div class="ric-row" style="${isAlt?'background:rgba(255,149,0,.03)':''}">
      <div class="ric-info">
        <div class="ric-name">${r.nome} ${spTag}</div>
        <div class="ric-meta">${r.note?r.note+' — ':''} ${r.ingredienti?.length||0} ingredienti</div>
      </div>
      <button class="btn-inline" onclick="openAddRic(null,${!!isAlt},'${r.id}')">Modifica</button>
      <button class="btn-inline btn-inline-red" onclick="delRic('${r.id}')">Elimina</button>
    </div>
    ${r.ingredienti?.length?`
    <div style="overflow-x:auto;background:var(--card2);border-top:1px solid var(--sep2)">
      <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:360px">
        <tbody>${r.ingredienti.map(i=>{const fi=fInfo(i.fornitoreId);return `<tr style="border-bottom:1px solid var(--sep2)">
          <td style="padding:8px 14px;font-weight:500">${i.nome}</td>
          <td style="padding:8px 10px;font-family:var(--mono);color:var(--tx2);text-align:right">${i.modo==='pp'?fQ(i.qta,i.unit):'—'}</td>
          <td style="padding:8px 10px;font-family:var(--mono);font-weight:600;color:var(--blue);text-align:right">${fQ(calcQ(i),i.unit)}</td>
          <td style="padding:8px 14px 8px 4px"><span style="font-size:11px;padding:2px 7px;border-radius:100px;background:${fi.color}18;color:${fi.color};font-weight:700">${fi.nome}</span></td>
        </tr>`;}).join('')}</tbody>
      </table>
    </div>`:''
  }</div>`;
}
function delRic(id){if(!confirm('Eliminare questa ricetta?'))return;ricette=ricette.filter(r=>r.id!==id);renderPortate();save();}

// ═══════════════════════════
// RICETTA MODAL
// ═══════════════════════════
function openAddRic(presetP,presetAlt,editId){
  const r=editId?ricette.find(x=>x.id===editId):null;
  const isAlt=r?r.isAlt:!!presetAlt;
  const genSpesa=r?(r.genSpesa!==undefined?r.genSpesa:true):true;
  const pOpts=PORTATE.map(p=>`<option value="${p.id}"${(presetP||r?.portata)===p.id?' selected':''}>${p.label}</option>`).join('');
  const rows=r?.ingredienti?.length?r.ingredienti.map((i,idx)=>iRow(idx,i)).join(''):iRow(0);
  window._ic=r?.ingredienti?.length||1;
  setModal('Ricetta',`
    <div class="form-row2">
      <div class="form-group"><label class="form-label">Nome</label><input class="form-input" id="r-nome" value="${r?r.nome:''}" placeholder="es. Risotto ai funghi"></div>
      <div class="form-group"><label class="form-label">Portata</label><select class="form-input" id="r-portata">${pOpts}</select></div>
    </div>
    <div class="form-group"><label class="form-label">Note</label><input class="form-input" id="r-note" value="${r?r.note||'':''}" placeholder="es. senza glutine…"></div>
    <label class="form-checkbox">
      <input type="checkbox" id="r-isalt" ${isAlt?'checked':''} onchange="toggleAltUI()">
      <span class="form-checkbox-label" style="color:${isAlt?'var(--orange)':'var(--blue)'}">Menu alternativo</span>
    </label>
    <div id="gen-wrap" style="margin-top:10px;display:${isAlt?'block':'none'}">
      <label class="form-checkbox">
        <input type="checkbox" id="r-genspesa" ${genSpesa?'checked':''}>
        <span class="form-checkbox-label">Genera lista spesa</span>
      </label>
    </div>
    <div class="sep-line"></div>
    <div class="form-group">
      <label class="form-label">Ingredienti</label>
      <p style="font-size:13px;color:var(--tx2);margin-bottom:10px">Per persona = moltiplicato per i coperti. Fisso = quantità invariabile.</p>
      <div class="ing-builder">
        <div class="ing-hdr">
          <span>Ingrediente</span><span>Modalità</span><span>Quantità</span><span>Unità</span><span>Fornitore</span><span></span>
        </div>
        <div id="i-rows">${rows}</div>
        <div class="ing-add"><button class="btn-sm-ios btn-secondary" type="button" onclick="addIRow()">+ Ingrediente</button></div>
      </div>
    </div>
  `,`
    <button class="btn-ios btn-secondary" onclick="closeM()">Annulla</button>
    <button class="btn-ios btn-primary" onclick="salvaRic('${editId||''}')">Salva</button>
  `);
}
function toggleAltUI(){const a=document.getElementById('r-isalt').checked;const w=document.getElementById('gen-wrap');if(w)w.style.display=a?'block':'none';}
function iRow(idx,ing){
  const m=ing?.modo||'pp';
  return `<div class="ing-row" id="ir-${idx}">
    <div class="ing-row-cell"><input placeholder="es. Riso" value="${ing?ing.nome:''}" id="in-${idx}"></div>
    <div class="ing-row-cell"><select id="im-${idx}"><option value="pp" ${m==='pp'?'selected':''}>Per pers.</option><option value="tot" ${m==='tot'?'selected':''}>Fisso</option></select></div>
    <div class="ing-row-cell"><input type="number" min="0" step="0.1" value="${ing?ing.qta:''}" id="iq-${idx}" style="text-align:right"></div>
    <div class="ing-row-cell"><select id="iu-${idx}">${uOpts(ing?.unit||'g')}</select></div>
    <div class="ing-row-cell"><select id="if-${idx}">${fOpts(ing?.fornitoreId)}</select></div>
    <div class="ing-row-cell"><button type="button" onclick="rmIRow(${idx})" style="background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px">×</button></div>
  </div>`;
}

function salvaRic(editId){
  const nome=document.getElementById('r-nome').value.trim();if(!nome){alert('Inserisci il nome');return;}
  const isAlt=document.getElementById('r-isalt').checked;
  const genSpesa=isAlt?document.getElementById('r-genspesa').checked:true;
  const ingredienti=[];
  document.querySelectorAll('[id^="ir-"]').forEach(row=>{
    const idx=row.id.split('-')[1];
    const n=document.getElementById('in-'+idx)?.value.trim();
    const q=parseFloat(document.getElementById('iq-'+idx)?.value);
    const m=document.getElementById('im-'+idx)?.value||'pp';
    const u=document.getElementById('iu-'+idx)?.value||'g';
    const f=document.getElementById('if-'+idx)?.value||fornitori[0]?.id;
    if(n&&!isNaN(q)&&q>=0)ingredienti.push({nome:n,modo:m,qta:q,unit:u,fornitoreId:f});
  });
  if(!ingredienti.length){alert('Aggiungi almeno un ingrediente');return;}
  const ric={id:editId||uid(),nome,portata:document.getElementById('r-portata').value,isAlt,genSpesa,note:document.getElementById('r-note').value.trim(),ingredienti};
  if(editId){const i=ricette.findIndex(x=>x.id===editId);if(i>=0)ricette[i]=ric;}
  else{ricette.push(ric);openP[ric.portata]=true;}
  closeM();renderPortate();save();
}

function ricalcola(){
  const c=totCop();const aggr={};
  ricette.filter(r=>!r.isAlt||r.genSpesa).forEach(r=>{
    r.ingredienti?.forEach(i=>{
      const key=(i.nome+'|'+i.unit+'|'+i.modo).toLowerCase();
      const fid=i.fornitoreId||fornitori[0]?.id;
      if(aggr[key]&&i.modo==='pp')aggr[key].qta+=i.qta;
      else if(!aggr[key])aggr[key]={id:'s'+uid(),nome:i.nome,modo:i.modo,qta:i.qta,unit:i.unit||'g',fornitoreId:fid,checked:false,prezzo:null,extraQta:0,extraUnit:i.unit||'g'};
    });
  });
  const prev={};spesaItems.forEach(s=>prev[(s.nome+'|'+s.unit+'|'+s.modo).toLowerCase()]=s);
  spesaItems=Object.values(aggr).map(s=>{
    const p=prev[(s.nome+'|'+s.unit+'|'+s.modo).toLowerCase()];
    return{...s,checked:p?p.checked:false,prezzo:p?p.prezzo:null,extraQta:p?p.extraQta:0,extraUnit:p?p.extraUnit:s.unit};
  });
  save();
}
function renderSpesa(){
  const c=totCop();
  const sub=document.getElementById('spesa-sub');if(sub)sub.textContent=`${c} coperti`;
  const pi=document.getElementById('print-info');if(pi)pi.textContent=`${c} coperti — ${new Date().toLocaleDateString('it-IT')}`;
  const pb=document.getElementById('pane-bar');
  if(pb)pb.innerHTML=pane.on?`<div class="pane-banner">Pane — da comprare q.b.${pane.note?' ('+pane.note+')':''}</div>`:'';
  // chips
  const ch=document.getElementById('s-chips');
  if(ch)ch.innerHTML=`<button class="chip${filtroF==='tutti'?' on':''}" onclick="setF('tutti')">Tutti (${spesaItems.length})</button>`
    +fornitori.map(f=>{const n=spesaItems.filter(s=>s.fornitoreId===f.id).length;return n?`<button class="chip${filtroF===f.id?' on':''}" onclick="setF('${f.id}')">${f.nome}</button>`:''}).join('');
  const filtered=filtroF==='tutti'?spesaItems:spesaItems.filter(s=>s.fornitoreId===filtroF);
  const body=document.getElementById('s-body');
  if(!filtered.length){body.innerHTML='<div class="empty">Nessun ingrediente.<br>Aggiungi ricette nel menu.</div>';renderExRows();updTotS();return;}
  const grp={};fornitori.forEach(f=>grp[f.id]=[]);
  filtered.forEach(s=>{if(!grp[s.fornitoreId])grp[s.fornitoreId]=[];grp[s.fornitoreId].push(s);});
  let html='';
  fornitori.forEach(f=>{
    const items=grp[f.id];if(!items?.length)return;
    html+=`<div class="forn-block">
      <div class="forn-hd" style="color:${f.color}">${f.nome}</div>
      ${items.map(s=>{
        const base=s.modo==='tot'?s.qta:s.qta*c;
        const fin=calcFin(s);
        const hasEx=(s.extraQta||0)>0;
        return `<div class="spesa-row">
          <div class="s-chk${s.checked?' done':''}" onclick="togChk('${s.id}',${!s.checked})"></div>
          <div style="flex:1">
            <div class="${s.checked?'s-name done':'s-name'}">${s.nome}</div>
            <div style="font-size:13px;color:var(--tx2);margin-top:1px">${fQ(base,s.unit)} base${hasEx?' + extra':''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
            <span class="s-qty" style="color:${hasEx?'var(--blue)':'var(--tx2)'}">${fQ(fin,s.unit)}</span>
            <div class="s-extra-wrap no-print">
              <span style="font-size:11px;color:var(--tx3)">+</span>
              <input type="number" min="0" step="0.1" value="${s.extraQta||''}" placeholder="0" oninput="updEx('${s.id}',this.value)">
              <select onchange="updExU('${s.id}',this.value)">${uOpts(s.extraUnit||s.unit)}</select>
            </div>
          </div>
          <div class="s-price no-print"><input type="number" placeholder="€" min="0" step="0.01" value="${s.prezzo||''}" oninput="updPrz('${s.id}',this.value)"></div>
        </div>`;}).join('')}
    </div>`;
  });
  body.innerHTML=html;renderExRows();updTotS();
}
function setF(id){filtroF=id;renderSpesa();}
function togChk(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.checked=v;save();renderSpesa();}}
function updEx(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.extraQta=parseFloat(v)||0;save();}updTotS();}
function updExU(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.extraUnit=v;save();}}
function updPrz(id,v){const s=spesaItems.find(x=>x.id===id);if(s){s.prezzo=parseFloat(v)||null;save();}updTotS();}
function updTotS(){
  const t=spesaItems.reduce((a,s)=>a+(s.prezzo||0),0)+spesaExtra.reduce((a,e)=>a+(e.prezzo||0),0);
  const el=document.getElementById('s-tot');if(el)el.textContent=eur(t);
  const cpp=document.getElementById('spesa-cpp');const c=totCop();
  if(cpp)cpp.textContent=t>0&&c>0?`${eur(t/c)} per coperto`:'';
}

function updTotC(){

      ${ev.pane?.on?'<br><b>Pane</b>: da comprare':''}

function ricaricaEv(id){
  const ev=storico.find(x=>x.id===id);if(!ev)return;
  if(!confirm('Sovrascrive il menu corrente?'))return;
  ricette=JSON.parse(JSON.stringify(ev.ricette));
  if(ev.pane)pane={...ev.pane};
  if(ev.det){det={...ev.det};['adulti','bambini','cucina'].forEach(k=>{const el=document.getElementById('c-'+k);if(el)el.value=det[k]||0;});}
  if(ev.altRapido)altRapido=JSON.parse(JSON.stringify(ev.altRapido));
  closeM();
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.toggle('on',b.dataset.s==='menu'));
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById('s-menu').classList.add('on');
  renderPortate();renderAlt();save();window.scrollTo(0,0);
}
function delEv(id){if(!confirm('Eliminare?'))return;storico=storico.filter(x=>x.id!==id);renderStorico();save();}

function delForn(id){if(!confirm('Eliminare?'))return;fornitori=fornitori.filter(f=>f.id!==id);renderFornitori();save();}

function setModal(title,body,footer){
  document.getElementById('m-title').textContent=title;
  document.getElementById('m-body').innerHTML=body;
  document.getElementById('m-footer').innerHTML=footer||'';
  document.getElementById('modal-bg').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeM(){
  document.getElementById('modal-bg').classList.remove('on');
  document.body.style.overflow='';
  window._ic=0;
}
function bgck(e){if(e.target===document.getElementById('modal-bg'))closeM();}
